<style>
/* VOICE: práctico, de mesa de cartas: claro y directo, para leer antes de zarpar
   IDEA: el boletín impreso de radio costera, con su traducción anotada al lado
   PICTURE: el traductor mismo, con una rosa de los vientos por zona que muestra la rolada
   COLOUR and TYPE: blanco, tinta, azul de río profundo dominante, rojo y amarillo de bandera de señales; Barlow Condensed + Barlow
   LAYOUT: banda azul con el traductor arriba, informe debajo, después glosario buscable, escalas y links */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1620);--ink:light-dark(#0e1a24,#e6eef3);--mute:light-dark(#51606c,#9fb1bd);
--river:light-dark(#0b4f6c,#0f3f57);--riverInk:#f3f8fb;--line:light-dark(#d9e2e8,#22323f);
--card:light-dark(#f4f7f9,#132230);--red:light-dark(#c62828,#ff6b6b);--yel:#f2c230}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,5vw,48px)}h2{font-size:32px;margin-bottom:12px}h3{font-size:22px}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.top{background:var(--river);color:var(--riverInk)}
.top p{color:#cfe2ec;max-width:68ch;margin:8px 0 20px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.flags{display:flex;gap:4px}.flags i{width:22px;height:14px;display:block}
.lang{display:flex;gap:6px}.lang button{min-height:40px;padding:0 14px;background:transparent;color:var(--riverInk);border:2px solid #5d93ad}.lang button[aria-pressed=true]{background:var(--riverInk);color:#0b4f6c;border-color:var(--riverInk)}
textarea{width:100%;min-height:200px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:14px;border-radius:10px;border:2px solid #2f7393;background:#062f42;color:#e8f3f8;resize:vertical}
textarea:focus,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:0;cursor:pointer}
.go{background:var(--yel);color:#1a1400}.ghost{background:transparent;color:var(--riverInk);border:2px solid #5d93ad}
select{font:16px Barlow,sans-serif;min-height:44px;padding:0 10px;border-radius:10px;border:2px solid #5d93ad;background:#062f42;color:#e8f3f8;max-width:100%}
.tz{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.small{font-size:13px;color:#b9d3e0}
#rep{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:16px}
.card.solo{grid-template-columns:minmax(0,1fr)}
.card h3{margin-bottom:6px}.card p{margin:6px 0}
.raw{font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere;margin-top:8px}
.pill{display:inline-block;font-weight:600;font-size:14px;padding:3px 10px;border-radius:99px;margin:6px 6px 0 0}
.p0{background:#e3eef5;color:#24506a}.p1{background:#d9f2e3;color:#145c34}.p2{background:#fff1c2;color:#6b5000}.p3{background:#ffd9d6;color:#8a1a14}
.rose{width:130px;height:130px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:var(--bg)}
.chip b{font-family:ui-monospace,Menlo,monospace}
.empty{color:var(--mute)}.note{font-size:13px;color:var(--mute)}
.gl-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
input[type=search]{font:16px Barlow,sans-serif;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);flex:1 1 240px}
.cat{background:var(--card);color:var(--ink);border:1px solid var(--line)}.cat[aria-pressed=true]{background:var(--river);color:var(--riverInk);border-color:var(--river)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mute);font-weight:600}
td.k{font:600 15px ui-monospace,Menlo,monospace}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex{font:13px ui-monospace,Menlo,monospace;color:var(--mute)}
.alt{background:var(--card)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px}
.links a{color:var(--ink);font-weight:600}.links li{margin:8px 0}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-family:Barlow,sans-serif;font-weight:500}.stack td:empty{display:none}
.card{grid-template-columns:minmax(0,1fr)}.rose{justify-self:start}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>

<section class="band top"><div class="wrap">
  <div class="bar">
    <div class="flags" aria-hidden="true"><i style="background:#c62828"></i><i style="background:#f2c230"></i><i style="background:#fff"></i><i style="background:#1d4fa0"></i></div>

  </div>

  <p data-t="intro"></p>
  <label for="txt" class="small" data-t="label"></label>

  <div class="row">
    <button class="go" id="go" data-t="go"></button>
    <button class="ghost" id="ejEs" data-t="exEs"></button>
    <button class="ghost" id="ejEn" data-t="exEn"></button>

</div></section>

<section class="band"><div class="wrap">
  <h2 data-t="repH"></h2>
  <div id="rep"></div>
  <p class="note" style="margin-top:14px" data-t="repNote"></p>
</div></section>

<section class="band alt"><div class="wrap">
  <h2 data-t="glH"></h2>
  <div class="gl-tools"><input type="search" id="q"></div>
  <div class="gl-tools" id="cats"></div>
  <table class="stack"><thead><tr><th data-t="thTerm"></th><th data-t="thMean"></th><th data-t="thEx"></th></tr></thead><tbody id="gl"></tbody></table>
  <p class="note" data-t="glNote"></p>
</div></section>

<section class="band"><div class="wrap grid2">
  <div>
    <h2 data-t="bfH"></h2>
    <div class="scroll"><table><thead><tr><th>F</th><th data-t="thName"></th><th data-t="thKt"></th><th>km/h</th><th data-t="thWater"></th></tr></thead><tbody id="bf"></tbody></table></div>
    <p class="note" data-t="bfNote"></p>
  </div>
  <div>
    <h2 data-t="dgH"></h2>
    <div class="scroll"><table><thead><tr><th>#</th><th>Español</th><th>English</th><th data-t="thWave"></th></tr></thead><tbody id="dg"></tbody></table></div>
    <h2 style="margin-top:28px" data-t="visH"></h2>
    <table><tbody id="vt"></tbody></table>
    <p class="note" data-t="nmNote"></p>
  </div>
</div></section>

<section class="band alt"><div class="wrap links">
  <h2 data-t="linksH"></h2>
  <ul>
    <li><a href="https://www.smn.gob.ar/">Servicio Meteorológico Nacional (SMN)</a>: <span data-t="l1"></span></li>
    <li><a href="https://community.wmo.int/node/36305">METAREA VI · WMO / OMM</a>: <span data-t="l2"></span></li>

  </ul>
  <p class="note" data-t="linksNote"></p>
</div></section>

const KNOWN=new Set();G.forEach(g=>g[1].split(/[\s\/·-]+/).forEach(w=>KNOWN.add(norm(w))));
('SECTOR CON DE EL LA LAS LOS DEL A Y EN AL HASTA DESDE PARTIR VIS MAR RAFAGAS RAFAGA FUERZA AREA ZONA RESTO PLATA INTERIOR EXTERIOR CENTRO NORTE SUR ESTE OESTE NORESTE NORDESTE NOROESTE SUDESTE SURESTE SUDOESTE SUROESTE COSTA LITORAL ROLANDO PERIODOS EVOLUCIONANDO LLUVIAS CHAPARRON TORMENTA PRONOSTICO VALIDO UTC SE SW NW VARIABLES MONTANOSA MUY GRUESA MAREJADA MAREJADILLA RIZADA ARBOLADA ENORME '
+'WIND WITH ON OF THE AND IN AT TO OR UNTIL FROM BY AFTER SEA GOOD MODERATE POOR VERY ROUGH SLIGHT SMOOTH RIPPLED HIGH PHENOMENAL LOW GALE WARNING STORM FORECAST VALID ISSUED SITUATION GENERAL SYNOPSIS INNER OUTER CENTRE CENTER NORTH SOUTH EAST WEST NORTHERLY SOUTHERLY EASTERLY WESTERLY NORTHEAST NORTHWEST SOUTHEAST SOUTHWEST GUST GUSTING SHOWER M KTS FORCE PROBABILITY CHANCE EXPECTED MOVIENDOSE SHIFTING MODERATING FAST RAPIDO LENTO TILL REST').split(' ').forEach(w=>KNOWN.add(w));

let last='';
function report(){const raw=$('#txt').value;try{localStorage.setItem('metarea-txt',raw)}catch(e){}
const t=norm(raw).replace(/\r/g,'');if(!t.trim()){$('#rep').innerHTML=`<p class="empty">${L()?'Pegá un boletín arriba.':'Paste a bulletin above.'}</p>`;return}
const re=/([A-Z][A-Z0-9 ,()\/-]{2,70}?):/g;const hs=[];let m;
while(m=re.exec(t)){if(/(^|[\n.:])\s*$/.test(t.slice(Math.max(0,m.index-3),m.index))||m.index===0)hs.push({n:m[1].trim(),i:m.index,e:m.index+m[0].length});else re.lastIndex=m.index+1}
const segs=[];if(!hs.length)segs.push({n:L()?'Boletín':'Bulletin',t});else{if(t.slice(0,hs[0].i).trim())segs.push({n:L()?'Encabezado':'Header',t:t.slice(0,hs[0].i)});hs.forEach((h,k)=>segs.push({n:h.n,t:t.slice(h.e,k+1<hs.length?hs[k+1].i:t.length)}))}
let html='',warn='';const hits=new Map(),unk=new Set();
segs.forEach(s=>{const tt=s.t.replace(/\s+/g,' ').trim();const isW=/WARNING|AVISO/.test(s.n);if(!tt){if(isW)warn=s.n;return}
(tt.match(/\b[A-Z]{2,}\b/g)||[]).forEach(w=>{if(!KNOWN.has(w))unk.add(w)});
const isSyn=/SITUACION|SINOPTIC|SYNOPSIS|GENERAL SITUATION/.test(s.n)||(/DEPRESION|DEPRESSION|ANTICICLON|CFNT|FRONT|FRENTE|VAGUADA|TROUGH|DORSAL|RIDGE|\bLOW\b.*HPA/.test(tt)&&!winds(tt).ws.length);
const w=isW?s.n:warn;warn='';
html+=(isSyn?synop(s.n,tt):zone(s.n,tt,w))||synop(s.n,tt)||`<article class="card solo"><div><h3>${esc(s.n)}</h3><p>${L()?'No encontré viento ni sistemas en esta parte.':'No wind or weather systems found in this part.'}</p><div class="raw">${esc(tt)}</div></div></article>`});
G.forEach(g=>{if(g[0]==='dir')return;g[1].split(/\s*[\/·]\s*/).forEach(k=>{const kk=norm(k);if(kk.length>1&&!/\d|DD|-ERLY/.test(kk)&&new RegExp('(^|[^A-Z])'+kk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z]|$)').test(t))hits.set(g[1],g[L()?2:3])})});
html+=`<article class="card solo"><div><h3>${L()?'Abreviaturas de este boletín':'Abbreviations in this bulletin'}</h3><div class="chips">${[...hits].map(([k,v])=>`<span class="chip"><b>${esc(k)}</b> · ${esc(v)}</span>`).join('')||`<span class="empty">${L()?'Ninguna del glosario.':'None from the glossary.'}</span>`}</div>${unk.size?`<h3 style="margin-top:14px;font-size:18px">${L()?'Palabras sin traducir':'Untranslated words'}</h3><div class="chips">${[...unk].slice(0,40).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`:''}</div></article>`;
$('#rep').innerHTML=html;$('#msg').textContent=L()?'Informe listo':'Report ready'}

function copy(){const txt=[...document.querySelectorAll('#rep .card')].map(c=>(c.querySelector('h3')?.textContent||'')+'\n'+[...c.querySelectorAll('p,.pill')].map(p=>p.textContent).join('\n')).join('\n\n');navigator.clipboard.writeText(txt).then(()=>$('#msg').textContent=L()?'Copiado':'Copied',()=>$('#msg').textContent=L()?'No se pudo copiar':'Could not copy')}

let cat='all';
function gl(){const q=norm($('#q').value.trim());const rows=G.filter(g=>(cat==='all'||g[0]===cat)&&(!q||norm(g.join(' ')).includes(q)));$('#gl').innerHTML=rows.map(g=>`<tr><td class="k">${esc(g[1])}</td><td>${esc(g[L()?2:3])}</td><td class="ex">${esc(g[4])}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">${L()?'Sin resultados.':'No results.'}</td></tr>`}
function cats(){$('#cats').innerHTML=[['all',S[lang].all],...Object.entries(CAT).map(([k,v])=>[k,v[L()?0:1]])].map(([k,v])=>`<button class="cat" aria-pressed="${k===cat}" data-c="${k}">${esc(v)}</button>`).join('')}
const PL={'-3':'Argentina · Uruguay · Brasília','-4':'Chile (invierno/winter) · Manaus','-2':'Fernando de Noronha','-5':'Perú · Ecuador · Colombia','0':'UTC / Z','1':'Europa central / Central Europe','2':'Sudáfrica / South Africa','-1':'Azores','12':'Nueva Zelanda / New Zealand'};
function tzOpts(){let h=`<option value="dev">${esc(S[lang].dev)}</option>`;for(let o=-12;o<=12;o++)h+=`<option value="${o}">${tzl(o)}${PL[o]?' · '+PL[o]:''}</option>`;$('#tz').innerHTML=h;$('#tz').value=tzv}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=S[lang][e.dataset.t]);document.title=S[lang].title;$('#q').placeholder=S[lang].glPh;$('#q').setAttribute('aria-label',S[lang].glH);
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
$('#bf').innerHTML=BF.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[L()?1:2]}</td><td class="n">${r[3]}</td><td class="n">${r[4]}</td><td>${r[L()?5:6]}</td></tr>`).join('');
$('#dg').innerHTML=DG.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${L()?r[3]:r[3].replace(/,/g,'.')}</td></tr>`).join('');
$('#vt').innerHTML=VT.map(r=>`<tr><td><b>${r[L()?0:1]}</b> <span class="note">· ${r[L()?1:0]}</span></td><td class="n">${r[2]}</td></tr>`).join('');
tzOpts();cats();gl();report()}

document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('metarea-lang',lang)}catch(x){}apply()});
$('#tz').addEventListener('change',e=>{tzv=e.target.value;try{localStorage.setItem('metarea-tz',tzv)}catch(x){}report()});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;cats();gl()});
$('#q').addEventListener('input',gl);
$('#go').addEventListener('click',report);$('#cp').addEventListener('click',copy);
$('#ejEs').addEventListener('click',()=>{$('#txt').value=EJ.es;report()});$('#ejEn').addEventListener('click',()=>{$('#txt').value=EJ.en;report()});
let saved=null;try{saved=localStorage.getItem('metarea-txt')}catch(e){}
$('#txt').value=saved||EJ[lang];apply();
}
</script>
</body>
</html>
