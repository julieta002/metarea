<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traductor METAREA VI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sereno y prolijo, como un kit de interfaz plano: aire, líneas finas, nada recargado
   IDEA: una "one page" náutica: barra de menú, encabezado con foto difuminada del río al atardecer, tarjetas planas tipo widget de clima
   PICTURE: el encabezado difuminado con el velero y el traductor justo debajo; cada zona es una tarjeta con la fuerza grande y la rosa de los vientos
   COLOUR and TYPE: verde agua #7fcab9 dominante, gris pizarra #3b3f42, blanco y gris claro; Lato 300/400/700
   LAYOUT: menú, encabezado, traductor, tres íconos, informe en grilla de tarjetas, glosario, banda verde con escalas, pie con fuentes */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#24282b);--soft:light-dark(#eef1f3,#2d3236);--ink:light-dark(#3b3f42,#e8ecee);--mute:light-dark(#7d8589,#a3abb0);
--teal:#7fcab9;--tealD:#5fb3a1;--slate:#3b3f42;--line:light-dark(#dfe4e7,#3d4448);--red:#e06b5f;--yel:#f2c230}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Lato,system-ui,sans-serif;font-weight:400;overflow-x:clip}
h1,h2,h3{font-weight:300;margin:0;line-height:1.1;text-wrap:balance}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(4vw,16px)}
/* menú */
nav{position:sticky;top:0;z-index:5;background:#3f8f7e;color:#fff}
nav .wrap{display:flex;align-items:center;gap:8px;min-height:52px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;margin-right:auto;padding:12px 0}
.menu{display:flex;overflow-x:auto;gap:2px}
.menu a{text-decoration:none;font-size:14px;padding:14px 12px;white-space:nowrap;color:#fff}
.menu a:hover{background:#357a6b}
.lang{display:flex;gap:4px}.lang button{min-height:36px;padding:0 10px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);font-size:13px}
.lang button[aria-pressed=true]{background:#fff;color:#2f6f63}
/* encabezado */
.hero{position:relative;min-height:340px;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;
background:linear-gradient(180deg,#d8c2b6 0%,#b7b3ad 28%,#7f9496 52%,#4e6164 72%,#2f3a3d 100%)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;filter:blur(5px)}
.hero .in{position:relative;padding:48px 16px}
.kick{font-size:14px;font-weight:700;opacity:.9}
.boxt{display:inline-block;background:rgba(40,45,48,.82);padding:12px 26px;margin:14px 0;font-size:clamp(26px,4.4vw,40px);font-weight:300}
.hero p{max-width:56ch;margin:0 auto;font-size:15px;opacity:.95}
/* traductor */
.tool{position:relative;margin-top:-36px;z-index:2}
.panel{background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.12);padding:22px}
.panel .bar{background:#3f8f7e;color:#fff;margin:-22px -22px 18px;padding:12px 22px;font-size:14px;font-weight:700}
label.s{font-size:13px;color:var(--mute);display:block;margin-bottom:6px}
textarea{width:100%;min-height:180px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);resize:vertical;border-radius:0}
select{font:15px Lato,sans-serif;min-height:44px;padding:0 10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);max-width:100%;border-radius:0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button{font:400 15px Lato,sans-serif;min-height:44px;padding:0 18px;border:0;border-radius:0;cursor:pointer}
.go{background:#3f8f7e;color:#fff;font-weight:700}.go:hover{background:#357a6b}
.ghost{background:var(--soft);color:var(--ink)}
textarea:focus,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--tealD);outline-offset:2px}
#msg{font-size:13px;color:var(--mute)}
/* íconos */
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px;padding:48px 0;text-align:center}
.feat svg{width:64px;height:64px}
.feat h3{font-size:15px;font-weight:700;margin:12px 0 6px}.feat p{margin:0;font-size:14px;color:var(--mute)}
section{padding:56px 0}
.sh{text-align:center;margin-bottom:28px}.sh h2{font-size:26px}.sh p{color:var(--mute);font-size:14px;margin:6px 0 0}
.soft{background:var(--soft)}
/* tarjetas de informe */
#rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.card{background:var(--bg);color:var(--ink);--rl:var(--line);--rm:var(--mute);--rf:var(--tealD);--ra:var(--yel);display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card.v0{background:#3f8f7e;color:#fff;--rl:rgba(255,255,255,.55);--rm:rgba(40,45,48,.55);--rf:#fff;--ra:#2f6f63}
.card.v2{background:var(--slate);color:#eef1f2;--rl:rgba(255,255,255,.3);--rm:rgba(255,255,255,.45);--rf:var(--teal);--ra:var(--yel)}
.ch{padding:14px 18px 0;text-align:center}.ch h3{font-size:15px;font-weight:700}
.cb{display:flex;justify-content:center;align-items:center;gap:20px;padding:12px 18px}
.big b{display:block;font-size:56px;font-weight:300;line-height:1}.big span{font-size:12px;opacity:.8}
.ct{padding:0 18px 18px;font-size:15px}.ct p{margin:8px 0}
.card .raw{font:12px/1.45 ui-monospace,Menlo,monospace;opacity:.7;overflow-wrap:anywhere;margin-top:10px;padding-top:10px;border-top:1px solid var(--rl)}
.rose{width:120px;height:120px}
.pill{display:inline-block;font-weight:700;font-size:13px;padding:3px 10px;margin:6px 6px 0 0;background:rgba(255,255,255,.92);color:#3b3f42}
.p0{border-left:4px solid #8aa9b8}.p1{border-left:4px solid #3fae7a}.p2{border-left:4px solid #e3b02f}.p3{border-left:4px solid var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);padding:5px 10px;font-size:13px;background:var(--soft)}.chip b{font-family:ui-monospace,Menlo,monospace}
.tag{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 10px;padding:0;list-style:none}
.tl .st{border:1px solid var(--rl);padding:4px 8px;font-size:13px}.tl .st span{opacity:.75;font-size:12px}.tl .ar{font-size:13px;opacity:.9}
.int{margin-top:12px;padding-top:10px;border-top:1px solid var(--rl)}.int h4{font-size:13px;margin:0 0 4px;font-weight:700}.int ul{margin:0;padding-left:18px}.int li{font-size:14px;margin:4px 0}
.term{background:none;border:0;border-bottom:1px dotted currentColor;color:inherit;font:inherit;padding:0;min-height:0;cursor:pointer;border-radius:0}
.tip{display:none;font-size:13px;background:rgba(255,255,255,.95);color:#3b3f42;padding:8px 10px;margin-top:8px}.tip.on{display:block}
.rawh{font-size:11px;opacity:.7;margin-top:10px}
.empty{color:var(--mute)}.note{font-size:13px;color:var(--mute)}
.card .rose text{fill:currentColor;opacity:.75}
/* glosario */
.gl-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
input[type=search]{font:16px Lato,sans-serif;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);flex:1 1 240px;border-radius:0}
.cat{background:var(--soft);color:var(--ink);font-size:14px}.cat[aria-pressed=true]{background:#3f8f7e;color:#fff}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:700}
td.k{font:700 14px ui-monospace,Menlo,monospace}td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
/* banda de escalas */
.tealband{background:#5fb3a1}.tealband .sh h2,.tealband .sh p{color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:20px}
.box{background:var(--bg);padding:18px}.box h3{font-size:18px;font-weight:700;margin-bottom:10px}
/* pie */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:24px;text-align:center}
.links a{text-decoration:none;display:block}.links .ic{width:56px;height:56px;border:1px solid var(--mute);border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:var(--mute)}
.links b{display:block;font-size:15px}.links span{font-size:13px;color:var(--mute)}
footer{background:var(--slate);color:#c9cfd2;font-size:13px;text-align:center;padding:18px 16px}
.scroll{overflow-x:auto}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-family:Lato,sans-serif;font-weight:400}.stack td:empty{display:none}
.menu{display:none}.hero{min-height:280px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>

</div>

<section class="soft" id="informe"><div class="wrap">

</div></section>

es:{title:'Traductor de boletines METAREA VI',intro:'Pegá el boletín marítimo tal como viene, en <b>español o en inglés</b> (mayúsculas y abreviaturas incluidas), y tocá <b>Armar informe</b>. Lo traduce zona por zona: viento en Beaufort, nudos y km/h, roladas, horario UTC pasado a tu hora local, fenómenos, visibilidad y estado del mar.',label:'Boletín (el que aparece al abrir es un ejemplo)',tzLabel:'Mostrar horarios en:',go:'Armar informe',exEs:'Ejemplo en español',exEn:'Ejemplo en inglés',copy:'Copiar informe',repH:'Informe',repNote:'La lectura para veleros es orientativa (pensada para un velero chico en salida recreativa) y esta página no es un pronóstico oficial: compará siempre con el último boletín, el viento medido en el lugar, el estado del agua y el criterio del patrón.',glH:'Glosario',glPh:'Buscar: BACK, VEERING, WKN, marejada, visibilidad…',thTerm:'Término',thMean:'Qué significa',thEx:'Ejemplo',glNote:'Abreviaturas habituales en boletines marítimos en español e inglés; cada servicio puede usar variantes. Si aparece una que no está, se lista en "Palabras sin traducir".',bfH:'Escala Beaufort',thName:'Nombre',thKt:'Nudos',thWater:'En el agua',bfNote:'Viento medio sostenido (no ráfagas). 1 nudo = 1,852 km/h.',dgH:'Estado del mar (Douglas)',thWave:'Altura de ola',visH:'Visibilidad',nmNote:'MN = milla náutica = 1852 m.',linksH:'Dónde leer el boletín',l1:'emite el boletín METAREA VI en español e inglés y los pronósticos para el Río de la Plata (buscá la sección de pronóstico marítimo).',l2:'cobertura oficial del área que pronostica Argentina.',l3:'marea, onda de tormenta y altura del Río de la Plata.',linksNote:'La página no puede descargar el boletín sola (el navegador bloquea pedidos a otros sitios): abrilo en la fuente, copiá el texto y pegalo arriba.',dev:'Hora de este dispositivo',all:'Todo',n1:'Traductor',n2:'Informe',n3:'Glosario',n4:'Escalas',n5:'Fuentes',kicker:'Río de la Plata · Atlántico Sur · Antártida',panelH:'Pegá tu boletín',f1h:'Zona por zona',f1 const L=()=>lang==='es';
const BN=i=>BF[i]?.[L()?1:2].toLowerCase();

function off(){return tzv==='dev'?-new Date().getTimezoneOffset()/60:+tzv}
const tzl=o=>'UTC'+(o<0?'−':'+')+Math.abs(o);
function toLocal(d,h,m){const now=new Date();let mo=now.getUTCMonth();const td=now.getUTCDate();if(d!=null&&d-td>15)mo--;if(d!=null&&td-d>15)mo++;const x=new Date(Date.UTC(now.getUTCFullYear(),mo,d??td,+h,+m)+off()*36e5);return {D:x.getUTCDate(),T:pad(x.getUTCHours())+':'+pad(x.getUTCMinutes())}}
function times(t){const out=[];const ctx=i=>{const p=t.slice(Math.max(0,i-16),i);return /HASTA|UNTIL|TILL/.test(p)?1:/DESDE|PARTIR|FROM|AFTER/.test(p)?2:0};
const W={es:['el','hasta el','desde el'],en:['on','until','from']};
const push=(i,d,h,m)=>{const c=ctx(i),lo=toLocal(d,h,m),o=tzl(off());out.push([i,d!=null?(L()?`${W.es[c]} día ${+d} a las ${h}:${m} UTC = día ${lo.D}, ${lo.T} (${o})`:`${W.en[c]} day ${+d} at ${h}:${m} UTC = day ${lo.D}, ${lo.T} local (${o})`):(L()?`a las ${h}:${m} UTC = ${lo.T} (${o})`:`at ${h}:${m} UTC = ${lo.T} local (${o})`)])};
for(const x of t.matchAll(/\b(\d{2})\/(\d{2})(\d{2})\b/g))push(x.index,x[1],x[2],x[3]);
for(const x of t.matchAll(/\b(\d{2})(\d{2})(\d{2})\s*(?:UTC|Z)\b/g))push(x.index,x[1],x[2],x[3]);
for(const x of t.matchAll(/\b(\d{2})(\d{2})\s*(?:UTC|Z)\b/g))push(x.index,null,x[1],x[2]);
return out.sort((a,b)=>a[0]-b[0]).map(x=>x[1])}

function winds(t){t=dirWords(t,true).replace(/\b(?:MOV|MOVING|MOVIENDOSE)\s+\w+(?:\s+(?:AT\s+|A\s+)?\d+\s*(?:KTS?|KNOTS|NUDOS))?/g,m=>' '.repeat(m.length));
const re=/(?:^|[\s,.;:(])(?:SECTOR\s+|WIND\s+|VIENTO\s+)?(NNE|ENE|ESE|SSE|SSW|WSW|WNW|NNW|SSO|OSO|ONO|NNO|NE|SE|SW|NW|SO|NO|N|E|S|W|O|VRB|VARIABLES?)\s+(?:FORCE\s+|FUERZA\s+|F)?(\d{1,2})(?:\s*(?:\/|-|TO|OR|A|O)\s*(\d{1,2}))?(\s*(?:KTS?|KNOTS|NUDOS)\b)?(?!\d|\s*(?:W|S|HPA|M)\b)/g;
return {t,ws:[...t.matchAll(re)].map(x=>{const a=+x[2],b=x[3]!=null?+x[3]:null,kt=!!x[4];return {d:/^V/.test(x[1])?null:x[1],a,b,kt,fa:kt?kt2bf(a):a,fb:kt?(b!=null?kt2bf(b):null):b,i:x.index,e:x.index+x[0].length}})}}
function frange(a,b){const lo=BF[a],hi=BF[b??a];if(!lo||!hi)return '';const k=[lo[3].split('–')[0],hi[3].split('–').pop()],m=[lo[4].split('–')[0],hi[4].split('–').pop()];return `${k[0]}–${k[1]} kt, ${m[0]}–${m[1]} km/h`.replace('<1–','0–').replace(/(\d+)\+–\1\+/g,'$1+')}
function wtext(w){const dn=dname(w.d);const two=w.fb!=null&&w.fb!==w.fa;
if(w.kt){const km=x=>Math.round(x*1.852);const k=w.b!=null?`${w.a}–${w.b} kt`:`${w.a} kt`,kmh=w.b!=null?`${km(w.a)}–${km(w.b)} km/h`:`${km(w.a)} km/h`;const f=two?`${L()?'fuerza':'force'} ${w.fa}${L()?' a ':' to '}${w.fb}`:`${L()?'fuerza':'force'} ${w.fa}`;return L()?`viento ${dn?'del '+dn:'variable'} de ${k} (${kmh}, ${f})`:`${dn?dn:'variable'} wind ${k} (${kmh}, ${f})`}
const f=two?(L()?`fuerza ${w.fa} a ${w.fb} (${BN(w.fa)} a ${BN(w.fb)})`:`force ${w.fa} to ${w.fb} (${BN(w.fa)} to ${BN(w.fb)})`):(L()?`fuerza ${w.fa} (${BN(w.fa)})`:`force ${w.fa} (${BN(w.fa)})`);
return (L()?`viento ${dn?'del '+dn:'variable'} `:`${dn?dn:'variable'} wind `)+f+', '+frange(w.fa,w.fb)}
function conn(p,c,bt){const T=L()?{b:'rola en sentido antihorario (BACK) a',v:'rola en sentido horario (VEER) a',cb:'rola en sentido antihorario a',cv:'rola en sentido horario a',c:'cambia a',up:'aumentando a',dn:'disminuyendo a',lt:'luego',tm:'por momentos',and:'y'}:{b:'backing (counterclockwise) to',v:'veering (clockwise) to',cb:'backing to',cv:'veering to',c:'becoming',up:'increasing to',dn:'decreasing to',lt:'later',tm:'at times',and:'and'};
if(/\bBACK/.test(bt))return T.b;if(/\bVEER/.test(bt))return T.v;

const c=(isSyn?synop(s.n,tt):zone(s.n,tt,w))||synop(s.n,tt)||`<article class="card wide"><header class="ch"><h3>${esc(s.n)}</h3></header><div class="ct"><p>${L()?'No encontré viento ni sistemas en esta parte.':'No wind or weather systems found in this part.'}</p>${rawBox(tt)}</div></article>`;if(c.includes('card wide'))syn+=c;else html+=c.replace('class="card z"','class="card z v'+(zk++%3)+'"')});
G.forEach(g=>{if(g[0]==='dir')return;g[1].split(/\s*[\/·]\s*/).forEach(k=>{const kk=norm(k);if(kk.length>1&&!/\d|DD|-ERLY/.test(kk)&&new RegExp('(^|[^A-Z])'+kk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^A-Z]|$)').test(t))hits.set(g[1],g[L()?2:3])})});
html+=`<article class="card wide"><header class="ch"><h3>${L()?'Abreviaturas de este boletín':'Abbreviations in this bulletin'}</h3></header><div class="ct"><div class="chips">${[...hits].map(([k,v])=>`<span class="chip"><b>${esc(k)}</b> · ${esc(v)}</span>`).join('')||`<span class="empty">${L()?'Ninguna del glosario.':'None from the glossary.'}</span>`}</div>${unk.size?`<h3 style="margin-top:14px;font-size:18px">${L()?'Palabras sin traducir':'Untranslated words'}</h3><div class="chips">${[...unk].slice(0,40).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`:''}</div></article>`;
$('#rep').innerHTML=syn+html;$('#msg').textContent=L()?'Informe listo':'Report ready'}

function copy(){const txt=[...document.querySelectorAll('#rep .card')].map(c=>(c.querySelector('h3')?.textContent||'')+'\n'+[...c.querySelectorAll('.tl,p,.pill,.int li')].map(p=>p.textContent).join('\n')).join('\n\n');navigator.clipboard.writeText(txt).then(()=>$('#msg').textContent=L()?'Copiado':'Copied',()=>$('#msg').textContent=L()?'No se pudo copiar':'Could not copy')}

let cat='all';
function gl(){const q=norm($('#q').value.trim());const rows=G.filter(g=>(cat==='all'||g[0]===cat)&&(!q||norm(g.join(' ')).includes(q)));$('#gl').innerHTML=rows.map(g=>`<tr><td class="k">${esc(g[1])}</td><td>${esc(g[L()?2:3])}</td><td class="ex">${esc(g[4])}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">${L()?'Sin resultados.':'No results.'}</td></tr>`}
function cats(){$('#cats').innerHTML=[['all',S[lang].all],...Object.entries(CAT).map(([k,v])=>[k,v[L()?0:1]])].map(([k,v])=>`<button class="cat" aria-pressed="${k===cat}" data-c="${k}">${esc(v)}</button>`).join('')}
const PL={'-3':'Argentina · Uruguay · Brasília','-4':'Chile (invierno/winter) · Manaus','-2':'Fernando de Noronha','-5':'Perú · Ecuador · Colombia','0':'UTC / Z','1':'Europa central / Central Europe','2':'Sudáfrica / South Africa','-1':'Azores','12':'Nueva Zelanda / New Zealand'};
function tzOpts(){let h=`<option value="dev">${esc(S[lang].dev)}</option>`;for(let o=-12;o<=12;o++)h+=`<option value="${o}">${tzl(o)}${PL[o]?' · '+PL[o]:''}</option>`;$('#tz').innerHTML=h;$('#tz').value=tzv}
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=S[lang][e.dataset.t]);document.title=S[lang].title;$('#q').placeholder=S[lang].glPh;$('#q').setAttribute('aria-label',S[lang].glH);
document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
$('#bf').innerHTML=BF.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[L()?1:2]}</td><td class="n">${r[3]}</td><td class="n">${r[4]}</td><td>${r[L()?5:6]}</td></tr>`).join('');
$('#dg').innerHTML=DG.map(r=>`<tr><td class="n">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="n">${L()?r[3]:r[3].replace(/,/g,'.')}</td></tr>`).join('');
$('#vt').innerHTML=VT.map(r=>`<tr><td><b>${r[L()?0:1]}</b> <span class="note">· ${r[L()?1:0]}</span></td><td class="n">${r[2]}</td></tr>`).join('');
tzOpts();cats();gl();report()}

document.querySelector('.lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.lang;try{localStorage.setItem('metarea-lang',lang)}catch(x){}apply()});
$('#tz').addEventListener('change',e=>{tzv=e.target.value;try{localStorage.setItem('metarea-tz',tzv)}catch(x){}report()});
$('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;cats();gl()});
$('#q').addEventListener('input',gl);
$('#rep').addEventListener('click',e=>{const b=e.target.closest('.term');if(!b)return;const g=TM.get(b.dataset.k);const tip=b.closest('.card').querySelector('.tip');if(!g||!tip)return;tip.innerHTML=`<b>${esc(g[1])}</b> · ${esc(g[L()?2:3])}`;tip.classList.add('on')});
$('#go').addEventListener('click',report);$('#cp').addEventListener('click',copy);
$('#ejEs').addEventListener('click',()=>{$('#txt').value=EJ.es;report()});$('#ejEn').addEventListener('click',()=>{$('#txt').value=EJ.en;report()});
let saved=null;try{saved=localStorage.getItem('metarea-txt')}catch(e){}
$('#txt').value=saved||EJ[lang];apply();
}
</script>
</body>
</html>
